# Builds the AIS Inventory TV Android app (APK) on GitHub - no Android Studio needed.
# Developed by RYZ Systems.
#
# Runs on every push to main, or click  Actions -> Build Android TV APK -> Run workflow.
# Download the APK from the run page -> "Artifacts" -> AIS_Inventory_TV-apk.
name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          VER=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/AIS_Inventory_TV.apk
          cp app/build/outputs/apk/release/app-release.apk "out/AIS_Inventory_TV-v${VER}.apk"
          ls -la out

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: AIS_Inventory_TV-apk
          path: out/*.apk
          if-no-files-found: error
